name: iOS CI

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  network:
    name: Network tests
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show environment
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/TestResults"
          {
            xcodebuild -version
            xcrun swift --version
          } 2>&1 | tee "$RUNNER_TEMP/TestResults/environment.log"

      - name: Test network package
        timeout-minutes: 5
        run: |
          swift test \
            --package-path Packages/SeriesAtlasNetwork \
            --enable-code-coverage \
            2>&1 | tee "$RUNNER_TEMP/TestResults/network-tests.log"
          SERIES_ATLAS_NETWORK_COVERAGE_PATH=$(swift test \
            --package-path Packages/SeriesAtlasNetwork \
            --show-codecov-path)
          cp "$SERIES_ATLAS_NETWORK_COVERAGE_PATH" \
            "$RUNNER_TEMP/TestResults/network-coverage.json"

      - name: Collect failure diagnostics
        if: failure() || cancelled()
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/TestResults"
          ps -axo pid,ppid,state,etime,command \
            > "$RUNNER_TEMP/TestResults/processes.txt" 2>&1 || true

      - name: Upload test results
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: network-test-results
          path: ${{ runner.temp }}/TestResults
          retention-days: 7
          if-no-files-found: warn

  ios-unit:
    name: iOS unit tests
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
      TEST_SUITE: unit

    steps: &ios-test-steps
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show environment
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/TestResults"
          {
            xcodebuild -version
            xcrun swift --version
            xcrun simctl list devices available
          } 2>&1 | tee "$RUNNER_TEMP/TestResults/environment.log"

      - name: Prepare simulator
        timeout-minutes: 3
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/TestResults/simulators-before.json"
          SERIES_ATLAS_SIMULATOR_ID=$(jq -er \
            --arg name "$SIMULATOR_NAME" \
            --arg runtime "$SIMULATOR_RUNTIME" '
              .devices[$runtime] // []
              | map(select(.isAvailable == true and .name == $name))
              | if length == 1 then .[0].udid
                else error("Expected exactly one available " + $name + " simulator for " + $runtime)
                end
            ' "$RUNNER_TEMP/TestResults/simulators-before.json")
          echo "SERIES_ATLAS_SIMULATOR_ID=$SERIES_ATLAS_SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$SERIES_ATLAS_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SERIES_ATLAS_SIMULATOR_ID" -b \
            2>&1 | tee "$RUNNER_TEMP/TestResults/simulator-boot.log"

      - name: Build app and tests
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project SeriesAtlas.xcodeproj \
            -scheme SeriesAtlas \
            -configuration Debug \
            -destination "$DESTINATION" \
            -destination-timeout 60 \
            -derivedDataPath "$RUNNER_TEMP/SeriesAtlasDerivedData" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            2>&1 | tee "$RUNNER_TEMP/TestResults/build.log"

      - name: Verify test bundles
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import json
          import os
          import plistlib
          from pathlib import Path

          plan = json.loads(Path("SeriesAtlas.xctestplan").read_text())
          expected = {
              entry["target"]["name"]
              for entry in plan["testTargets"]
              if not entry.get("skipped", False)
          }
          products = Path(os.environ["RUNNER_TEMP"]) / "SeriesAtlasDerivedData/Build/Products"
          actual = set()
          for path in products.glob("*.xctestrun"):
              run = plistlib.loads(path.read_bytes())
              for configuration in run.get("TestConfigurations", []):
                  if configuration.get("IsEnabled", True):
                      actual.update(target["BlueprintName"] for target in configuration["TestTargets"])
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing test bundles: {', '.join(sorted(missing))}")
          print(f"Verified test bundles: {', '.join(sorted(expected))}")
          PY

      - name: Run tests
        timeout-minutes: 10
        run: |
          case "$TEST_SUITE" in
            unit) TEST_SELECTION=(-skip-testing:SeriesAtlasUITests) ;;
            ui) TEST_SELECTION=(-only-testing:SeriesAtlasUITests) ;;
            *) echo "Unsupported test suite: $TEST_SUITE" >&2; exit 1 ;;
          esac
          xcodebuild \
            -project SeriesAtlas.xcodeproj \
            -scheme SeriesAtlas \
            -configuration Debug \
            -destination "$DESTINATION" \
            -destination-timeout 60 \
            -derivedDataPath "$RUNNER_TEMP/SeriesAtlasDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults/SeriesAtlas.xcresult" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            "${TEST_SELECTION[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building \
            2>&1 | tee "$RUNNER_TEMP/TestResults/tests.log"

      - name: Export coverage report
        timeout-minutes: 1
        run: |
          xcrun xccov view --report "$RUNNER_TEMP/TestResults/SeriesAtlas.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/TestResults/coverage.txt"

      - name: Collect failure diagnostics
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/TestResults"
          ps -axo pid,ppid,state,etime,command \
            > "$RUNNER_TEMP/TestResults/processes.txt" 2>&1 || true
          if [ -f "$HOME/Library/Logs/CoreSimulator/CoreSimulator.log" ]; then
            cp "$HOME/Library/Logs/CoreSimulator/CoreSimulator.log" \
              "$RUNNER_TEMP/TestResults/CoreSimulator.log" || true
          fi
          xcrun simctl list devices --json \
            > "$RUNNER_TEMP/TestResults/simulators-after.json" 2>&1 || true
          if [ -n "${SERIES_ATLAS_SIMULATOR_ID:-}" ]; then
            xcrun simctl spawn "$SERIES_ATLAS_SIMULATOR_ID" log show \
              --last 10m --style compact \
              --predicate 'process == "testmanagerd" OR process == "runningboardd" OR process == "SpringBoard" OR process == "SeriesAtlas" OR process == "SeriesAtlasUITests-Runner" OR process == "xctest"' \
              > "$RUNNER_TEMP/TestResults/simulator.log" 2>&1 || true
          fi

      - name: Upload test results
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-${{ env.TEST_SUITE }}-test-results
          path: ${{ runner.temp }}/TestResults
          retention-days: 7
          if-no-files-found: warn

  ios-ui:
    name: iOS UI tests
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
      TEST_SUITE: ui

    steps: *ios-test-steps

  verify:
    name: Build and tests
    if: ${{ always() }}
    needs: [network, ios-unit, ios-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful test jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["NEEDS_JSON"])
          required = {"network", "ios-unit", "ios-ui"}
          if set(results) != required:
              raise SystemExit("Unexpected or missing test jobs")
          unsuccessful = {
              name: job.get("result")
              for name, job in results.items()
              if job.get("result") != "success"
          }
          if unsuccessful:
              raise SystemExit(f"Test jobs did not succeed: {unsuccessful}")
          print("All test jobs succeeded.")
          PY
